  <div class="main">
    <div class="topbar">
      <div class="breadcrumb">Overview / <b>Employees</b></div>
      <div class="topbar-right">
        <div class="avatar" data-user-initials>MO</div>
      </div>
    </div>

    <div class="content">
      <div class="page-head">
        <div>
          <div class="page-title">Employees</div>
          <div class="page-sub">Auditors on your team</div>
        </div>
        <button class="btn btn-primary" id="addEmployeeBtn">+ Add Employee</button>
      </div>

      <div class="card">
        <table class="data">
          <thead><tr><th>Name</th><th>Title</th><th>Email</th><th>Assigned audits</th><th></th></tr></thead>
          <tbody id="employeesTableBody"><tr><td colspan="5" class="cell-sub">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Employee modal -->
<div class="modal-overlay" id="empModalOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="empModalTitle">Add Employee</h2>
      <button type="button" class="modal-close" id="empModalClose">&times;</button>
    </div>
    <div class="form-error" id="empFormError" style="display:none;"></div>
    <form id="empForm">
      <div class="form-row two-col">
        <label>Full name<input type="text" id="fEmpName" required></label>
        <label>Title<input type="text" id="fEmpTitle" placeholder="e.g. Senior Auditor"></label>
      </div>
      <div class="form-row">
        <label>Email<input type="email" id="fEmpEmail" required></label>
      </div>
      <div class="form-row">
        <label id="fEmpPasswordLabel">Password<input type="text" id="fEmpPassword" placeholder="Set an initial password"></label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-secondary" id="empModalCancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="empSubmitBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/employees.js"></script>

</html>
