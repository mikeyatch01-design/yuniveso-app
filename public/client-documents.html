<html lang="en">
<head>

<title>Documents — YUNIVESO</title>
<link rel="stylesheet" href="theme.css?v=2">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0}
  a{color:#2456C7;text-decoration:none}
</style>
</head>
<body>
<div class="app-shell" style="width:1440px;height:1024px;">

  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">YUNIVESO</div>
        <div class="brand-sub">Client Portal</div>
      </div>
    </div>
    <div class="nav-scroll">
      <div class="nav-section-title">Kesteven Manufacturing</div>
      <a class="nav-item" href="client-portal.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.7"/></svg>Overview</a>

      <a class="nav-item" href="client-messages.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Messages</a>
      <a class="nav-item" href="#"><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M4 9h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Audit Timeline</a>
    </div>
    <div class="sidebar-footer">
      <div class="avatar avatar-sm" style="background:#2A3242;color:#fff;" data-user-initials>EW</div>
      <div style="min-width:0;">
        <div style="font-size:13px;color:#fff;font-weight:600;white-space:nowrap;" data-user-name>Elena Wren</div>
        <div style="font-size:11.5px;color:#7C8598;">Finance Director</div>
      </div>
      <a href="#" id="signOutLink" style="margin-left:auto;color:#7C8598;" title="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3v9"/><path d="M18.4 6.6a8 8 0 1 1-12.8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>

      <div class="breadcrumb">Kesteven Manufacturing / <b>Documents</b></div>
      <div class="topbar-right">
        <div class="avatar" data-user-initials>EW</div>
      </div>
    </div>

    <div class="content">
      <div class="page-head">
        <div>
          <div class="page-title">Documents</div>
          <div class="page-sub">Everything requested from you and everything you've submitted</div>
        </div>
        <div>
          <button class="btn btn-primary" id="uploadBtn">+ Upload Document</button>
          <input type="file" id="uploadInput" accept=".pdf,.xls,.xlsx,image/png,image/jpeg" hidden>
        </div>
      </div>

      <div class="card">
        <table class="data">
          <thead><tr><th>Document</th><th>Audit</th><th>Requested by</th><th>Due</th><th>Status</th></tr></thead>
          <tbody id="docsTableBody"><tr><td colspan="5" class="cell-sub">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js?v=2"></script>
<script src="js/client-documents.js?v=2"></script>

</html>
