<body>

        <div class="brand-name">YUNIVESO</div>

      <a class="nav-item" href="admin-dashboard.html" data-admin-only><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.7"/></svg>Dashboard</a>
      <a class="nav-item" href="auditor-dashboard.html" data-auditor-only><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.7"/></svg>My Dashboard</a>
      <a class="nav-item" href="clients.html" data-admin-only><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M2.5 19c.9-3.4 3.4-5 6.5-5s5.6 1.6 6.5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Clients</a>
      <a class="nav-item" href="audits.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M9 12.5 11 14.5 15.5 9.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/></svg>Audits</a>
      <a class="nav-item active" href="tasks.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="19" cy="18" r="1.6" fill="currentColor"/></svg><span id="tasksNavLabel">Tasks</span></a>
      <a class="nav-item" href="employees.html" data-admin-only><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.7"/><path d="M5 20c1.2-3.8 4-5.6 7-5.6s5.8 1.8 7 5.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Employees</a>
      <a class="nav-item" href="findings-tracker.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M12 3 3 20h18L12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 10v4M12 17h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Findings</a>

      <div class="nav-section-title" data-admin-only>Workspace</div>
      <a class="nav-item" href="reports-analytics.html" data-admin-only><svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M4 19V9m6 10V4m6 15v-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Reports</a>

    </div>
    <div class="sidebar-footer">
      <div class="avatar avatar-sm" style="background:#2A3242;color:#fff;" data-user-initials>MO</div>
      <div style="min-width:0;">
        <div style="font-size:13px;color:#fff;font-weight:600;white-space:nowrap;" data-user-name>Marcus Okoye</div>
        <div style="font-size:11.5px;color:#7C8598;" id="roleLabel">Admin</div>
      </div>
      <a href="#" id="signOutLink" style="margin-left:auto;color:#7C8598;" title="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3v9"/><path d="M18.4 6.6a8 8 0 1 1-12.8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </a>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="breadcrumb">Overview / <b id="breadcrumbLabel">Tasks</b></div>
      <div class="topbar-right">
        <button type="button" class="theme-toggle-btn" id="themeToggleBtn" title="Toggle dark mode"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button>
        <div class="avatar" data-user-initials>MO</div>
      </div>
    </div>

    <div class="content">
      <div class="page-head">
        <div>
          <div class="page-title" id="pageTitle">Tasks</div>
          <div class="page-sub" id="pageSub">Loading…</div>
        </div>
        <button class="btn btn-primary" id="addTaskBtn" data-admin-only>+ New Task</button>
      </div>

      <div class="card">
        <table class="data">
          <thead><tr><th>Task</th><th>Audit</th><th>Assigned to</th><th>Due</th><th>Status</th><th></th></tr></thead>
          <tbody id="tasksTableBody"><tr><td colspan="6" class="cell-sub">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- New Task modal (admin only) -->
<div class="modal-overlay" id="taskModalOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <h2>New Task</h2>
      <button type="button" class="modal-close" id="taskModalClose">&times;</button>
    </div>
    <div class="form-error" id="taskFormError" style="display:none;"></div>
    <form id="taskForm">
      <div class="form-row">
        <label>Title<input type="text" id="fTaskTitle" required></label>
      </div>
      <div class="form-row two-col">
        <label>Audit (optional)
          <select id="fTaskAudit"><option value="">— None —</option></select>
        </label>
        <label>Assign to
          <select id="fTaskAssignee"><option value="">— Unassigned —</option></select>
        </label>
      </div>
      <div class="form-row">
        <label>Due date<input type="date" id="fTaskDue"></label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-secondary" id="taskModalCancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="taskSubmitBtn">Create</button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js?v=4"></script>
<script src="js/tasks.js?v=2"></script>
</body>
</html>
