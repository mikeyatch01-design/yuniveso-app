      <div style="display:grid;grid-template-columns:280px 1fr;height:100%;">
        <div style="border-right:1px solid var(--border);overflow-y:auto;" id="threadsList">
          <div class="cell-sub" style="padding:20px;">Loading…</div>
        </div>
        <div style="display:flex;flex-direction:column;height:100%;">
          <div id="threadHeader" style="padding:20px 24px;border-bottom:1px solid var(--border);font-weight:700;">Select a client</div>
          <div id="messagesList" style="flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;"></div>
          <form id="messageForm" style="display:none;gap:10px;padding:16px 24px;border-top:1px solid var(--border);">
            <input type="text" id="fMessageBody" placeholder="Type a message…" style="flex:1;border:1.5px solid var(--border);border-radius:9px;padding:10px 14px;font-size:13.5px;font-family:inherit;">
            <button type="submit" class="btn btn-primary">Send</button>

        </div>
